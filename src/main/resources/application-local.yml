# BM: Konfigurasi H2 sementara untuk pembangunan sahaja, bukan penyimpanan akaun production.
# EN: Ephemeral H2 configuration for local development only, not production account storage.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:zrain-auth;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
